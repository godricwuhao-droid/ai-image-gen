<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Image Generator - Test</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
        }
        .container {
            text-align: center;
            padding: 40px;
            background: rgba(255,255,255,0.1);
            border-radius: 20px;
            backdrop-filter: blur(10px);
            max-width: 600px;
        }
        h1 { font-size: 48px; margin-bottom: 20px; }
        .status { font-size: 24px; margin: 20px 0; }
        .success { color: #90EE90; }
        .info { margin-top: 30px; font-size: 16px; opacity: 0.8; }
        .links { margin-top: 20px; }
        .links a {
            display: inline-block;
            margin: 10px;
            padding: 12px 24px;
            background: white;
            color: #667eea;
            text-decoration: none;
            border-radius: 8px;
            font-weight: 600;
            transition: transform 0.2s;
        }
        .links a:hover { transform: scale(1.05); }
    </style>
</head>
<body>
    <div class="container">
        <h1>AI Image Generator</h1>
        <div class="status success">Frontend Service Running</div>
        <div class="info">
            <p>Frontend Version: 1.0.0</p>
            <p>Server Time: <span id="time"></span></p>
            <p>Status: All Systems Operational</p>
        </div>
        <div class="links">
            <a href="http://localhost">Main Application</a>
            <a href="http://localhost:8000/docs">API Documentation</a>
        </div>
    </div>
    <script>
        document.getElementById('time').textContent = new Date().toLocaleString();
    </script>
</body>
</html>
